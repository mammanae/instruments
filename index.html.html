<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TW-4 T-6B Instrument Practice</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#e9edf4;background:#101217;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:590px;margin:auto}.panel{border:1px solid #353941;border-radius:16px;padding:16px;background:#191c22}.group{margin-bottom:16px}.label{font-size:13px;color:#a9b1bf;margin-bottom:8px}.radio{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:15px}.radio input{accent-color:#e4e9f4;width:17px;height:17px}hr{border:0;border-top:1px solid #343840;margin:17px 0}.heading{display:flex;align-items:center;justify-content:space-between;margin:12px 0 15px}.badge{font-size:12px;color:#d3d8e2;border:1px solid #454b55;border-radius:20px;padding:5px 9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#242831;border-radius:10px;text-align:center;padding:17px 7px}.stat .label{margin:0 0 6px;font-size:11px}.stat strong{font-size:25px;font-weight:650;letter-spacing:.5px}.instrument{background:#0b1522;border-radius:12px;padding:8px;display:flex;justify-content:center}.instrument svg{max-width:390px;width:100%;height:auto}.question{font-size:15px;line-height:1.65;margin:8px 0 18px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#b6becb;margin-bottom:7px}input[type=text]{width:100%;background:#252a33;border:1px solid #454c58;border-radius:9px;color:#fff;padding:12px;font-size:15px;outline:none}input[type=text]:focus{border-color:#a2b2ca}.actions{display:flex;gap:9px;margin-top:17px}.actions button{flex:1;padding:12px 7px;border-radius:10px;border:1px solid #cbd2df;font-weight:600;cursor:pointer;font-size:14px}.primary{background:#e5eaf3;color:#1a202a}.secondary{background:transparent;color:#e5eaf3}.results{margin-top:20px}.result-header{display:flex;justify-content:space-between;align-items:center}.result-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #30343c;padding:12px 0;font-size:13px}.result-row .correct{font-weight:600;text-align:right}.result-row small{display:block;color:#9ba4b1;margin-top:3px}.pass{color:#6ddd9b}.fail{color:#fa8b90}@media(max-width:420px){.panel{padding:12px}.actions button{font-size:12px}}
</style></head><body><main class="wrap"><section class="panel"><div class="group"><div class="label">Practice category</div><label class="radio"><input type="radio" name="category" value="holding" checked> Holding</label><label class="radio"><input type="radio" name="category" value="orientation"> NAVAID Orientation</label><label class="radio"><input type="radio" name="category" value="radial"> Radial Intercepts</label></div><hr><div class="heading"><strong id="problemNumber">Problem 1</strong><span id="badge" class="badge">Standard turns</span></div><div id="visual"></div><div style="margin-top:18px"><strong>Question</strong><p id="question" class="question"></p></div><div id="fields"></div><div class="actions"><button class="primary" id="grade">Grade &amp; Reveal</button><button class="secondary" id="next">↻ New Problem</button></div><div id="results" class="results" hidden></div></section></main><script>
const fmt=n=>String(((n-1+3600)%360)+1).padStart(3,'0'),mod=n=>(n%360+360)%360,signed=(a,b)=>mod(a-b+180)-180,rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)],dirs=['North','Northeast','East','Southeast','South','Southwest','West','Northwest'],direction=a=>dirs[Math.floor((mod(a)+22.5)/45)%8];
const makeHolding=combo=>{const standard=combo<3,type=['Direct','Parallel','Teardrop'][combo%3],radial=rand(1,36)*10;let delta;if(type==='Parallel')delta=(standard?-1:1)*rand(1,109);else if(type==='Teardrop')delta=(standard?1:-1)*rand(1,69);else delta=(standard?70:110)+rand(1,179);return{heading:mod(radial-delta),radial,standard,type,combo}};
const makeOrientation=()=>({radial:rand(1,36)*10,heading:rand(1,360),template:rand(0,1)});
const makeRadial=()=>{const radial=rand(1,36)*10,heading=rand(1,360),delta=pick([-60,-45,45,60]),course=mod(radial+delta),inbound=rand(0,1)===1,track=mod(course+(inbound?180:0)),intercept=mod(track+(delta>0?45:-45));return{radial,heading,course,inbound,intercept}};
let category='holding',p={heading:90,radial:360,standard:true,type:'Parallel',combo:1},pool=[0,2,3,4,5],number=1;
const station=()=>mod(p.radial+180),turnTo=a=>signed(a,p.heading)>=0?'Right':'Left';
const schema=()=>category==='holding'?[{label:'Entry type',correct:p.type},{label:'Entry turn',correct:p.type==='Parallel'?(p.standard?'Left':'Right'):(p.standard?'Right':'Left')},{label:'Entry heading',correct:fmt(p.type==='Teardrop'?mod(p.radial+(p.standard?-30:30)):p.radial)+'°'}]:category==='orientation'?(p.template===0?[{label:'Aircraft location',correct:direction(p.radial)},{label:'Direction to NAVAID',correct:direction(station())},{label:'Aircraft radial',correct:fmt(p.radial)+'°'}]:[{label:'Turn direction',correct:turnTo(station())},{label:'Approximate heading',correct:fmt(station())+'°'}]):[{label:'Turn direction',correct:turnTo(p.intercept)},{label:'Intercept heading',correct:fmt(p.intercept)+'°'},{label:'Intercept type',correct:'45°'}];
const question=()=>category==='holding'?`Instructed to “hold ${direction(p.radial).toLowerCase()} of the VOR on the ${fmt(p.radial)} radial, ${p.standard?'standard':'nonstandard'} turns, expected further clearance 26 time now 05”. A ______ entry is required with an entry turn to the ______ with a heading of ______.`:category==='orientation'?(p.template===0?'The aircraft is located ______ of the NAVAID. What general direction is the NAVAID located relative to the aircraft? What radial is the aircraft on?':'In order to fly to the NAVAID, you must turn ______ to an approximate heading of ______.'):`You have been instructed to intercept the ${fmt(p.course)} radial ${p.inbound?'inbound':'outbound'}. You will turn ______ to a heading of ______ for a ______ intercept.`;
const pt=(deg,r)=>({x:160+Math.sin(deg*Math.PI/180)*r,y:160-Math.cos(deg*Math.PI/180)*r});
function instrument(){const ticks=Array.from({length:36},(_,i)=>i*10).map(t=>{const a=pt(t,126),b=pt(t,t%30===0?111:119),c=pt(t,96);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#e2e8f0" stroke-width="${t%30===0?2:1}"/>${t%30===0?`<text x="${c.x}" y="${c.y+5}" text-anchor="middle" font-size="15" font-weight="600" fill="#f8fafc" transform="rotate(${t} ${c.x} ${c.y})">${t===0?'N':t===90?'E':t===180?'S':t===270?'W':String(t/10).padStart(2,'0')}</text>`:''}`}).join('');const cdi=category==='radial'?`<g transform="rotate(${p.course-p.heading} 160 160)"><path d="M160 46 L160 105 M160 215 L160 272" stroke="#f5f5f5" stroke-width="5"/><path d="M155 60 L160 45 L165 60" stroke="white" fill="none" stroke-width="2"/>${[-2,-1,1,2].map(d=>`<circle cx="${160+d*18}" cy="160" r="3.3" stroke="white" stroke-width="1.4" fill="none"/>`).join('')}<path d="M160 110 V210" stroke="#f8fafc" stroke-width="5"/></g>`:'';return `<div class="instrument"><svg viewBox="0 0 320 330" aria-label="HSI with aircraft heading ${fmt(p.heading)}, bearing pointer to station ${fmt(station())}"><circle cx="160" cy="160" r="150" fill="#151c27" stroke="#64748b" stroke-width="4"/><circle cx="160" cy="160" r="129" fill="#090e17" stroke="#94a3b8" stroke-opacity=".55"/><g transform="rotate(${-p.heading} 160 160)">${ticks}</g><g transform="rotate(${station()-p.heading} 160 160)"><path d="M160 47 L160 273" stroke="#29db67" stroke-width="3"/><path d="M150 69 L160 48 L170 69" stroke="#29db67" stroke-width="3" fill="none"/><circle cx="160" cy="76" r="7" stroke="#29db67" stroke-width="2.5" fill="#101926"/></g>${cdi}<path d="M160 12 L150 31 L170 31 Z" fill="#ffbd43"/><path d="M141 160 H153 M167 160 H179 M160 146 V174" stroke="white" stroke-width="2.5"/><circle cx="160" cy="160" r="4" fill="white"/><rect x="117" y="282" width="86" height="25" rx="3" fill="#25364a" stroke="#64748b"/><text x="160" y="300" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">${fmt(p.heading)}°</text><text x="160" y="325" text-anchor="middle" fill="#94a3b8" font-size="11">AIRCRAFT HEADING</text></svg></div>`}
function render(){document.getElementById('problemNumber').textContent=`Problem ${number}`;const badge=document.getElementById('badge');badge.style.display=category==='holding'?'':'none';badge.textContent=p.standard?'Standard turns':'Nonstandard turns';document.getElementById('visual').innerHTML=category==='holding'?`<div class="stats"><div class="stat"><div class="label">AIRCRAFT HEADING</div><strong>${fmt(p.heading)}°</strong></div><div class="stat"><div class="label">HOLDING RADIAL</div><strong>${fmt(p.radial)}°</strong></div></div>`:instrument();document.getElementById('question').textContent=question();document.getElementById('fields').innerHTML=schema().map((f,i)=>`<div class="field"><label for="a${i}">${i+1}. ${f.label}</label><input id="a${i}" type="text" placeholder="Enter answer" autocomplete="off"></div>`).join('');document.getElementById('results').hidden=true;document.querySelectorAll('#fields input').forEach(x=>x.addEventListener('input',()=>document.getElementById('results').hidden=true))}
function check(v,correct){const clean=s=>s.trim().toLowerCase().replace(/[°\s]/g,'');const a=clean(v),b=clean(correct);if(!a)return false;if(a===b)return true;if(/^\d+$/.test(a)&&/^\d+$/.test(b))return Number(a)===Number(b);return false}
document.getElementById('grade').onclick=()=>{const s=schema(),values=s.map((_,i)=>document.getElementById(`a${i}`).value),score=s.filter((f,i)=>check(values[i],f.correct)).length;const root=document.getElementById('results');root.hidden=false;root.innerHTML=`<hr><div class="result-header"><strong>Results</strong><h2>${score}/${s.length}</h2></div>`+s.map((f,i)=>{const ok=check(values[i],f.correct);return `<div class="result-row"><span><span class="${ok?'pass':'fail'}">${ok?'✓':'✕'}</span> ${f.label}</span><span class="correct">${f.correct}${ok?'':`<small>Your answer: ${values[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')||'—'}</small>`}</span></div>`}).join('')};
document.getElementById('next').onclick=()=>{if(category==='holding'){const available=pool.length?pool:[0,1,2,3,4,5],combo=pick(available);p=makeHolding(combo);pool=available.filter(x=>x!==combo)}else p=category==='orientation'?makeOrientation():makeRadial();number++;render()};document.querySelectorAll('input[name=category]').forEach(el=>el.onchange=()=>{category=el.value;p=category==='holding'?makeHolding(1):category==='orientation'?makeOrientation():makeRadial();pool=[0,1,2,3,4,5];number=1;render()});render();
</script></body></html>
